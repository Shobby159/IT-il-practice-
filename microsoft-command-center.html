<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>Certification Command Center</title>
<style>
:root{
  --navy:#0f1b2d; --navy2:#16263f; --bg:#f4f6f9; --panel:#ffffff; --line:#dde3ec;
  --txt:#17233a; --dim:#5d6b82; --blue:#2563eb; --blue-soft:#e8effd;
  --green:#0e7a4a; --green-soft:#e2f2ea; --amber:#b45309; --amber-soft:#fdf1de;
  --red:#bb2d2d; --red-soft:#fbe9e9; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}
#app{display:flex;min-height:100vh}
nav{width:210px;background:var(--navy);color:#c6d2e4;padding:22px 0;flex-shrink:0;position:sticky;top:0;height:100vh}
nav .brand{padding:0 20px 18px;font-weight:700;color:#fff;font-size:15px;letter-spacing:.3px;border-bottom:1px solid #22344f;margin-bottom:10px}
nav .brand span{display:block;font-size:11px;font-weight:500;color:#7d8fa9;letter-spacing:1.5px;margin-top:2px}
nav a{display:block;padding:9px 20px;color:#c6d2e4;text-decoration:none;font-size:13.5px;font-weight:500;border-left:3px solid transparent;cursor:pointer}
nav a:hover{background:var(--navy2)}
nav a.on{background:var(--navy2);color:#fff;border-left-color:var(--blue)}
main{flex:1;padding:28px 34px;max-width:1080px}
h1{font-size:21px;font-weight:700;margin-bottom:4px;letter-spacing:-.2px}
h2{font-size:12px;font-weight:650;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin:26px 0 12px}
.sub{color:var(--dim);font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:2px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13.5px;min-height:40px}
button:hover{border-color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#1d4fc4}
button.ghost{background:transparent;border-color:transparent;color:var(--blue);padding:6px 8px;min-height:32px}
button.danger{color:var(--red)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:4px;text-transform:uppercase}
.tag.official{background:var(--blue-soft);color:var(--blue)}
.tag.video{background:#efe7fb;color:#6d28d9}
.tag.paid{background:var(--amber-soft);color:var(--amber)}
.tag.practice{background:var(--green-soft);color:var(--green)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.8px;padding:3px 10px;border-radius:12px}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.gray{background:#eceff4;color:var(--dim)}
.bar{height:7px;background:#e8ecf2;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar i.green{background:var(--green)} .bar i.amber{background:var(--amber)} .bar i.red{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt);width:100%;min-height:40px}
textarea{min-height:80px;resize:vertical}
label{font-size:12px;font-weight:600;color:var(--dim);display:block;margin-bottom:4px;letter-spacing:.4px}
.field{margin-bottom:12px}
.gate td{padding:6px 10px}
.gate .ok{color:var(--green);font-weight:700}
.gate .fail{color:var(--red);font-weight:700}
.next-action{background:var(--navy);color:#fff;border-radius:12px;padding:24px 26px;margin-bottom:16px}
.next-action .k{font-size:11px;letter-spacing:2px;color:#8fa2bd;font-weight:700}
.next-action .a{font-size:19px;font-weight:700;margin:8px 0 4px}
.next-action .why{font-size:13.5px;color:#b9c6d9;line-height:1.55}
.next-action .meta{font-family:var(--mono);font-size:12.5px;color:#8fa2bd;margin-top:10px}
.pipe .nm{font-weight:650;width:90px;display:inline-block}
.clickable{cursor:pointer}
.clickable:hover{background:#fafbfd}
.screen{display:none}.screen.on{display:block}
.rlabel{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.6px;width:84px;flex-shrink:0}
.mist{border-left:3px solid var(--red);padding-left:14px;margin-bottom:12px}
.mist.REPAIRED{border-left-color:var(--green);opacity:.75}
.mist.RELAPSED{border-left-color:var(--amber)}
.small{font-size:12.5px;color:var(--dim)}
.hr{border:none;border-top:1px solid var(--line);margin:16px 0}
#searchbox{max-width:420px}
.labrow select{width:170px;min-height:34px;padding:5px 8px;font-size:12.5px}
@media(max-width:840px){
  #app{flex-direction:column}
  nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:10px}
  nav .brand{display:none}
  nav a{white-space:nowrap;border-left:none;border-bottom:3px solid transparent}
  nav a.on{border-bottom-color:var(--blue)}
  main{padding:18px 16px}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<div id="app">
<nav id="nav">
  <div class="brand">Command Center<span>MICROSOFT CERTIFICATIONS</span></div>
  <a data-s="today" class="on" onclick="go('today')">Today</a>

  <a data-s="plan" onclick="go('plan')">Plan</a>
  <a data-s="resources" onclick="go('resources')">Resources</a>

</nav>

</main>
</div>

  resources:[

 {id:'pl900', name:'PL-900', full:'Power Platform Fundamentals', tier:'fund', order:6, target:'2026-08-30', effort:[4,6],
  domains:[{n:'Business value of Power Platform',w:17.5,lo:15,hi:20},{n:'Core components of Power Platform',w:42.5,lo:40,hi:45},{n:'Power BI capabilities',w:12.5,lo:10,hi:15},{n:'Power Apps capabilities',w:12.5,lo:10,hi:15},{n:'Power Automate capabilities',w:12.5,lo:10,hi:15}],
  resources:[

 {id:'pl300', name:'PL-300', full:'Power BI Data Analyst', tier:'assoc', order:7, target:'2026-09-06', effort:[18,24],
  domains:[{n:'Prepare the data',w:27.5,lo:25,hi:30},{n:'Model the data',w:27.5,lo:25,hi:30},{n:'Visualize and analyze the data',w:27.5,lo:25,hi:30},{n:'Manage and secure Power BI',w:17.5,lo:15,hi:20}],
  labs:['Power Query transformations','Data cleaning & profiling','Relationships & cardinality','Star schema design','DAX fundamentals','Measures vs calculated columns','Visualizations & report design','Workspaces & deployment','Row-level security'],
  resources:[
   {label:'PL-300 Exam Readiness Zone — Prepare the Data', url:'https://learn.microsoft.com/en-us/shows/exam-readiness-zone/preparing-for-pl-300-prepare-the-data', tag:'official', role:'PRIMARY'},
   {label:'Official Study Guide', url:'https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/pl-300', tag:'official', role:'OFFICIAL BLUEPRINT'},
   {label:'Ravikiran PL-300 Practice Tests / PBIX Labs', url:'https://www.udemy.com/course/pl-300-practice-tests-microsoft-power-bi-data-analyst/', tag:'paid', role:'PRACTICE'},
   {label:'Phillip Burton PL-300 (repair weak areas only)', url:'https://www.udemy.com/course/70-778-analyzing-and-visualizing-data-with-power-bi/', tag:'paid', role:'BACKUP'}]},
 {id:'sc300', name:'SC-300', full:'Identity & Access Administrator', tier:'assoc', order:8, target:'2026-09-13', effort:[16,22],
  domains:[{n:'Implement and manage user identities',w:22.5,lo:20,hi:25},{n:'Implement authentication and access management',w:27.5,lo:25,hi:30},{n:'Plan and implement workload identities',w:22.5,lo:20,hi:25},{n:'Plan and automate identity governance',w:27.5,lo:25,hi:30}],
  labs:['Microsoft Entra ID tenant basics','Users & groups administration','Authentication methods & MFA','Conditional Access policies','Identity governance & access reviews','Workload identities','Privileged Identity Management concepts'],
  resources:[

   {label:'Official Study Guide', url:'https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-300', tag:'official', role:'OFFICIAL BLUEPRINT'},
   {label:'Tutorials Dojo SC-300 Practice Exams', url:'https://portal.tutorialsdojo.com/courses/sc-300-microsoft-identity-and-access-administrator-practice-exams/', tag:'paid', role:'PRACTICE'}]},
 {id:'sc401', name:'SC-401', full:'Information Security Administrator', tier:'assoc', order:9, target:'2026-09-20', effort:[12,18],
  domains:[{n:'Implement information protection',w:33,lo:30,hi:35},{n:'Implement DLP and retention',w:33,lo:30,hi:35},{n:'Manage risks, alerts, and activities',w:34,lo:30,hi:35}],
  labs:['Microsoft Purview portal navigation','Sensitivity labels & policies','Information protection scanners/classifiers','DLP policies','Retention policies & labels','Insider Risk management','Alerts & audit','eDiscovery concepts'],
  resources:[
   {label:'John Christopher SC-401 Course', url:'https://www.udemy.com/course/sc-400-course-microsoft-information-protection-administrator/', tag:'paid', role:'PRIMARY'},
   {label:'Official SC-401T00 Course', url:'https://learn.microsoft.com/en-us/training/courses/sc-401t00', tag:'official', role:'BACKUP'},
   {label:'Official Study Guide', url:'https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-401', tag:'official', role:'OFFICIAL BLUEPRINT'}]},
 {id:'az104', name:'AZ-104', full:'Azure Administrator', tier:'capstone', order:10, target:'2026-09-27', effort:[28,36],
  domains:[{n:'Manage Azure identities and governance',w:22.5,lo:20,hi:25},{n:'Implement and manage storage',w:17.5,lo:15,hi:20},{n:'Deploy and manage compute resources',w:22.5,lo:20,hi:25},{n:'Implement and manage virtual networking',w:17.5,lo:15,hi:20},{n:'Monitor and maintain Azure resources',w:12.5,lo:10,hi:15}],
  labs:['Entra ID + RBAC assignments','Subscriptions & resource groups','Azure Policy','Storage accounts & blob/file storage','Virtual machines','App Service','Containers','Virtual networks & NSGs','DNS & load balancing','Monitoring & alerts','Backup & recovery','Azure CLI basics','PowerShell basics','ARM/Bicep awareness'],
  resources:[
   {label:'John Christopher AZ-104 Course (with simulations)', url:'https://www.udemy.com/course/az-104-microsoft-azure-administrator-course-with-simulations/', tag:'paid', role:'PRIMARY'},
   {label:'Official Study Guide', url:'https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104', tag:'official', role:'OFFICIAL BLUEPRINT'},
   {label:'Tutorials Dojo AZ-104 Practice Exams', url:'https://portal.tutorialsdojo.com/courses/az-104-microsoft-azure-administrator-practice-exams/', tag:'paid', role:'PRACTICE'}]}
];
const COMPLETED_PRIOR = [{name:'ITIL 4 Foundation', score:'35 / 40', pct:'87.5%'}];
const GATES = {
 fund:   {freshN:2, avg:80, weakDom:70, hands:0,  label:'Fundamentals gate'},
 assoc:  {freshN:2, avg:80, weakDom:75, hands:80, label:'Associate gate'},
 capstone:{freshN:2, avg:82, weakDom:75, hands:90, label:'Capstone gate'}
};
// ================= STORAGE (raw records; derived stats always recomputed) =================
const LS = {
 get(k,f){ try{ const v = localStorage.getItem('mscc_'+k); return v===null?f:JSON.parse(v);}catch(e){return f;} },
 set(k,v){ try{ localStorage.setItem('mscc_'+k, JSON.stringify(v)); }catch(e){} },
 del(k){ try{ localStorage.removeItem('mscc_'+k); }catch(e){} }
};
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function certState(){ return LS.get('certs', {}); }          // {cid:{status, examDate, examScore, notes, domains?}}
function attempts(){ return LS.get('attempts', []); }         // raw practice attempts
function mistakes(){ return LS.get('mistakes', []); }         // raw mistake records
function labState(){ return LS.get('labs', {}); }             // {cid:{labName:level}}
function sessions(){ return LS.get('sessions', []); }         // study session log
function certOf(cid){ return CERTS.find(c => c.id === cid); }
function domainsOf(cid){ const ov = (certState()[cid]||{}).domains; return ov && ov.length ? ov : certOf(cid).domains; }
function statusOf(cid){ return (certState()[cid]||{}).status || 'NOT STARTED'; }
function setCert(cid, patch){ const s = certState(); s[cid] = Object.assign(s[cid]||{}, patch); LS.set('certs', s); }
function currentCert(){
 for(const c of CERTS){ if(statusOf(c.id) !== 'PASSED') return c; }
 return null;
}
// ================= DERIVED STATS =================
function attemptsFor(cid){ return attempts().filter(a => a.cid === cid).sort((a,b) => a.ts - b.ts); }
function freshAttempts(cid){ return attemptsFor(cid).filter(a => a.fresh); }
function pct(a){ return a.total ? Math.round(100*a.correct/a.total) : 0; }
function overall(cid){
 const fr = freshAttempts(cid);
 if(!fr.length) return null;
 const last = fr.slice(-2);   // current level = last two fresh results; the baseline is diagnosis, not evidence
 return Math.round(last.reduce((s,a) => s + pct(a), 0) / last.length);
}
function domainStats(cid){
 const out = {};
 domainsOf(cid).forEach(d => out[d.n] = {c:0,t:0,w:d.w});
 attemptsFor(cid).forEach(a => {
  const mult = a.fresh ? 2 : 1;                       // fresh evidence counts double
  Object.entries(a.domainScores||{}).forEach(([dn,ds]) => {
   if(out[dn] && ds.t > 0){ out[dn].c += ds.c*mult; out[dn].t += ds.t*mult; }
  });
 });
 Object.values(out).forEach(o => o.acc = o.t ? Math.round(100*o.c/o.t) : null);
 return out;
}
function weakestDomain(cid){
 const ds = Object.entries(domainStats(cid)).filter(([n,o]) => o.acc !== null);
 if(!ds.length) return null;
 ds.sort((a,b) => a[1].acc - b[1].acc);
 return { name:ds[0][0], acc:ds[0][1].acc };
}
function domainPriority(cid){
 return Object.entries(domainStats(cid)).map(([n,o]) => {
  const deficit = o.acc === null ? 0.6 : (1 - o.acc/100);
  const hotErr = mistakes().some(m => m.cid===cid && m.domain===n && m.confidence==='Sure' && m.state!=='REPAIRED');
  return { n, w:o.w, acc:o.acc, score: (o.w/100) * deficit * (hotErr ? 1.5 : 1) };
 }).sort((a,b) => b.score - a.score);
}
function confErrSummary(cid){
 const ms = mistakes().filter(m => m.cid === cid && m.confidence === 'Sure');
 return { active: ms.filter(m => m.state === 'ACTIVE'),
          relapsed: ms.filter(m => m.state === 'RELAPSED'),
          repaired: ms.filter(m => m.state === 'REPAIRED'),
          lifetime: ms.length };
}
function handsOn(cid){
 const c = certOf(cid);
 if(!c.labs) return null;
 const st = labState()[cid] || {};
 const V = {'NOT STARTED':0,'ATTEMPTED':0.25,'CAN DO WITH HELP':0.5,'CAN DO ALONE':1,'MASTERED':1};
 const tot = c.labs.reduce((s,l) => s + (V[st[l]||'NOT STARTED']), 0);
 return Math.round(100 * tot / c.labs.length);
}
function strongFreshCount(cid, g){ return freshAttempts(cid).filter(a => pct(a) >= g.avg - 5).length; }
function readiness(cid){
 const c = certOf(cid), g = GATES[c.tier];
 const ov = overall(cid), wd = weakestDomain(cid), ho = handsOn(cid), ce = confErrSummary(cid);
 const hot = ce.active.length + ce.relapsed.length;
 const lines = [];
 const sf = strongFreshCount(cid, g);
 lines.push({k:'Fresh practice attempts (\u2265'+g.freshN+' strong)', v: sf + ' strong', ok: sf >= g.freshN});
 lines.push({k:'Fresh average \u2265 '+g.avg+'%', v: ov === null ? 'no data' : ov + '%', ok: ov !== null && ov >= g.avg});
 lines.push({k:'Weakest domain \u2265 '+g.weakDom+'%', v: wd ? wd.acc + '% (' + wd.name + ')' : 'no data', ok: !!wd && wd.acc >= g.weakDom});

 // explainable %: component share + partial credit on the score components
 let p = 0, per = 100/lines.length;

 $('s-mistakes').innerHTML =
  '<h1>Mistakes</h1><div class="sub">Wrong-while-sure = confident error = highest repair priority. Repair means a later, independent, correct recall \u2014 not rereading.</div>' +
  '<div class="card" style="margin-top:16px"><h2 style="margin-top:0">Log mistake</h2><div class="grid g3">' +
  '<div class="field"><label>Certification</label><select id="mi-cid">' + CERTS.map(x => '<option value="'+x.id+'"' + (x.id===(cid||(currentCert()||CERTS[0]).id)?' selected':'') + '>' + esc(x.name) + '</option>').join('') + '</select></div>' +
  '<div class="field"><label>Domain</label><input id="mi-dom" placeholder="exam domain"></div>' +
  '<div class="field"><label>Confidence when wrong</label><select id="mi-conf"><option selected>Sure</option><option>Unsure</option><option>Guess</option></select></div></div>' +
  '<div class="field"><label>Concept / question topic</label><input id="mi-con"></div>' +
  '<div class="grid g2"><div class="field"><label>My wrong instinct</label><input id="mi-wrong"></div>' +
  '<div class="field"><label>Correct rule</label><input id="mi-right"></div></div>' +
  '<div class="field"><label>Why I got it wrong</label><input id="mi-why"></div>' +
  '<button class="primary" onclick="saveMistake()">Save mistake</button></div>' +
  '<div class="row spread" style="margin:18px 0 10px"><h2 style="margin:0">All mistakes (' + ms.length + ')</h2><input id="mi-q" style="max-width:260px" placeholder="filter..." value="' + esc(q) + '" oninput="renderMistakes()"></div>' +
  ms.filter(m => !q || JSON.stringify(m).toLowerCase().includes(q)).map(m => {
   const c = certOf(m.cid);
   return '<div class="card mist ' + m.state + '"><div class="row spread"><div>' +
    '<b>' + esc(m.concept) + '</b> <span class="small">' + esc(c ? c.name : '') + ' \u00B7 ' + esc(m.domain||'') + ' \u00B7 ' + esc(m.confidence) + (m.confidence==='Sure' ? ' \u26A0' : '') + '</span>' +
    '<div class="small" style="margin-top:5px"><b style="color:var(--red)">Wrong instinct:</b> ' + esc(m.wrong||'\u2014') + '<br><b style="color:var(--green)">Correct rule:</b> ' + esc(m.right||'\u2014') + (m.why ? '<br><b>Why:</b> ' + esc(m.why) : '') + '</div>' +
    '<div class="small" style="margin-top:4px">Logged ' + new Date(m.ts).toLocaleDateString() + (m.repairedTs ? ' \u00B7 repaired ' + new Date(m.repairedTs).toLocaleDateString() : '') + '</div></div>' +
    '<div style="text-align:right"><span class="pill ' + (m.state==='ACTIVE'?'red':m.state==='RELAPSED'?'amber':'green') + '">' + m.state + '</span>' +
    '<div class="row" style="margin-top:8px;justify-content:flex-end">' +
    (m.state !== 'REPAIRED' ? '<button class="ghost" onclick="mState(\''+m.id+'\',\'REPAIRED\')">Repaired \u2713</button>' : '<button class="ghost" onclick="mState(\''+m.id+'\',\'RELAPSED\')">Relapsed \u21BA</button>') +
    '<button class="ghost danger" onclick="mDel(\''+m.id+'\')">delete</button></div></div></div></div>';
  }).join('');
}
function saveMistake(){
 if(!$('mi-con').value.trim()){ alert('Concept is required.'); return; }
 const all = mistakes();
 all.push({ id:uid('mis'), cid:$('mi-cid').value, domain:$('mi-dom').value.trim(), concept:$('mi-con').value.trim(),
  wrong:$('mi-wrong').value.trim(), right:$('mi-right').value.trim(), why:$('mi-why').value.trim(),
  confidence:$('mi-conf').value, ts:Date.now(), state:'ACTIVE' });
 LS.set('mistakes', all);
 renderMistakes();
}
function mState(id, st){
 const all = mistakes();
 const m = all.find(x => x.id === id);
 if(!m) return;
 if(st === 'REPAIRED' && !confirm('Repaired = you recalled the correct rule independently, later, without looking. True?')) return;
 m.state = st;
 if(st === 'REPAIRED') m.repairedTs = Date.now();
 LS.set('mistakes', all);
 renderMistakes();
}
function mDel(id){ if(!confirm('Delete this mistake record?')) return; LS.set('mistakes', mistakes().filter(m => m.id !== id)); renderMistakes(); }
// -------- LABS --------
function renderLabs(){
 const LV = ['NOT STARTED','ATTEMPTED','CAN DO WITH HELP','CAN DO ALONE','MASTERED'];
 $('s-labs').innerHTML = '<h1>Hands-on tracker</h1><div class="sub">Watching a demo earns nothing here. Score reflects independent execution.</div>' +
  CERTS.filter(c => c.labs).map(c => {
   const st = labState()[c.id] || {};
   return '<h2>' + esc(c.name) + ' \u2014 ' + handsOn(c.id) + '% (gate ' + GATES[c.tier].hands + '%)</h2><div class="card">' +
    c.labs.map(l => '<div class="row spread labrow" style="padding:6px 0;border-bottom:1px solid var(--line)"><span style="font-size:13.5px">' + esc(l) + '</span>' +
     '<select onchange="setLab(\''+c.id+'\', this.dataset.l, this.value)" data-l="' + esc(l) + '">' +
     LV.map(v => '<option' + ((st[l]||'NOT STARTED')===v?' selected':'') + '>' + v + '</option>').join('') + '</select></div>').join('') + '</div>';
  }).join('');
}
function setLab(cid, lab, v){ const s = labState(); s[cid] = s[cid] || {}; s[cid][lab] = v; LS.set('labs', s); renderLabs(); }
// -------- PLAN --------
function renderPlan(){
 $('s-plan').innerHTML = '<h1>Plan</h1><div class="sub">Targets, not hard deadlines \u2014 readiness overrides schedule. The only fixed date is 30 September.</div>' +
  '<div class="card" style="margin-top:16px"><table><tr><th>Cert</th><th>Target</th><th>Effort</th><th>Logged</th><th>Status</th><th>Deadline impact</th></tr>' +
  CERTS.map(c => {
   const st = statusOf(c.id), R = readiness(c.id);
   const late = new Date(c.target) < new Date() && st !== 'PASSED';
   return '<tr class="clickable" onclick="openCert(\''+c.id+'\')"><td><b>' + esc(c.name) + '</b></td><td>' + esc(c.target) + '</td>' +
    '<td>~' + c.effort[0] + '\u2013' + c.effort[1] + 'h</td><td>' + hoursLogged(c.id) + 'h</td>' +
    '<td>' + (st==='PASSED' ? '<span class="pill green">PASSED</span>' : R.ready ? '<span class="pill green">READY</span>' : '<span class="pill blue">' + R.pct + '%</span>') + '</td>' +
    '<td>' + (st==='PASSED' ? '\u2014' : late ? '<span class="pill amber">BEHIND TARGET</span>' : '<span class="pill gray">on track</span>') + '</td></tr>';
  }).join('') + '</table>' +
  '<div class="small" style="margin-top:12px">Sep 28\u201330 is buffer/retake. If a cert is ready early, take the exam early \u2014 the sequence continues automatically after each PASS.</div></div>' +
  '<h2>Study sessions (' + sessions().length + ')</h2><div class="card">' +
  (sessions().length ? '<table><tr><th>Date</th><th>Cert</th><th>Min</th><th>Note</th></tr>' +
   sessions().slice(-25).reverse().map(s => '<tr><td>' + new Date(s.ts).toLocaleDateString() + '</td><td>' + esc((certOf(s.cid)||{}).name||'') + '</td><td>' + s.mins + '</td><td>' + esc(s.note||'') + '</td></tr>').join('') + '</table>' : '<span class="sub">No sessions yet \u2014 use the timer on Today.</span>') + '</div>';
}
// -------- RESOURCES + SEARCH --------
function renderResources(){
 const q = ($('res-q') && $('res-q').value || '').toLowerCase();
 $('s-resources').innerHTML = '<h1>Resources</h1>' +
  '<input id="res-q" style="max-width:420px;margin:14px 0" placeholder="Search exam, domain, resource, mistake, note..." value="' + esc(q) + '" oninput="renderResources()">' +
  CERTS.filter(c => !q || c.name.toLowerCase().includes(q) || c.full.toLowerCase().includes(q) ||
    c.resources.some(r => r.label.toLowerCase().includes(q)) || domainsOf(c.id).some(d => d.n.toLowerCase().includes(q)))
   .map(c => '<h2>' + esc(c.name) + '</h2><div class="card">' + c.resources.map(resBtn).join('') + '</div>').join('') +
  (q ? (function(){
   const mHits = mistakes().filter(m => JSON.stringify(m).toLowerCase().includes(q));
   const nHits = CERTS.filter(c => ((certState()[c.id]||{}).notes||'').toLowerCase().includes(q));
   return (mHits.length ? '<h2>Mistakes matching</h2><div class="card">' + mHits.map(m => '<div class="small" style="padding:5px 0">' + esc((certOf(m.cid)||{}).name||'') + ' \u00B7 <b>' + esc(m.concept) + '</b> \u2014 ' + esc(m.right||'') + '</div>').join('') + '</div>' : '') +
    (nHits.length ? '<h2>Memory sheets matching</h2><div class="card">' + nHits.map(c => '<div class="small clickable" style="padding:5px 0" onclick="openCert(\''+c.id+'\')"><b>' + esc(c.name) + '</b> sheet</div>').join('') + '</div>' : '');
  })() : '');
}
// -------- SETTINGS --------
function renderSettings(){
 $('s-settings').innerHTML = '<h1>Settings & data</h1>' +
  '<h2>Backup</h2><div class="card"><div class="row">' +
  '<button class="primary" onclick="exportBackup()">EXPORT BACKUP</button>' +
  '<button onclick="$(\'imp-file\').click()">IMPORT BACKUP</button>' +
  '<input type="file" id="imp-file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])"></div>' +
  '<div class="small" style="margin-top:8px" id="bk-msg">Everything lives in this browser\u2019s localStorage. Export after real sessions; import on your other device.</div></div>' +
  '<h2>Reset</h2><div class="card"><div class="row">' +
  '<select id="rst-cid" style="max-width:220px">' + CERTS.map(c => '<option value="'+c.id+'">' + esc(c.name) + '</option>').join('') + '</select>' +
  '<button class="danger" onclick="resetCert()">Reset certification</button>' +
  '<button class="danger" onclick="resetAll()">RESET ALL DATA</button></div></div>' +
  '<div class="small">Command Center v1.0 \u00B7 raw records (attempts, mistakes, labs, sessions) are the source of truth; every statistic is recomputed from them.</div>';
}
function exportBackup(){
 const dump = { v:1, exported:Date.now(), certs:certState(), attempts:attempts(), mistakes:mistakes(), labs:labState(), sessions:sessions() };
 const blob = new Blob([JSON.stringify(dump)], {type:'application/json'});
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = 'cert-command-center-backup-' + new Date().toISOString().slice(0,10) + '.json';
 a.click();
}
function importBackup(file){
 if(!file) return;
 const r = new FileReader();
 r.onload = () => {
  try{
   const d = JSON.parse(r.result);
   if(!d || d.v !== 1) throw new Error('Not a valid backup.');
   // merge, dedupe by id, never lose records
   const mergeArr = (key, cur) => {
    const seen = new Set(cur.map(x => x.id));
    (d[key]||[]).forEach(x => { if(!seen.has(x.id)) cur.push(x); });
    return cur;
   };
   LS.set('attempts', mergeArr('attempts', attempts()));
   LS.set('mistakes', mergeArr('mistakes', mistakes()));
   LS.set('sessions', mergeArr('sessions', sessions()));
   const lc = labState(); Object.entries(d.labs||{}).forEach(([cid,m]) => { lc[cid] = Object.assign({}, m, lc[cid]||{}); }); LS.set('labs', lc);
   const cc = certState(); Object.entries(d.certs||{}).forEach(([cid,m]) => { cc[cid] = Object.assign({}, m, cc[cid]||{}); }); LS.set('certs', cc);
   $('bk-msg').textContent = 'Merged: ' + attempts().length + ' attempts \u00B7 ' + mistakes().length + ' mistakes \u00B7 ' + sessions().length + ' sessions.';
  } catch(e){ $('bk-msg').textContent = 'Import failed: ' + e.message; }
 };
 r.readAsText(file);
}
function resetCert(){
 const cid = $('rst-cid').value;
 if(!confirm('Reset ALL data for ' + certOf(cid).name + '? Cannot be undone.')) return;
 LS.set('attempts', attempts().filter(a => a.cid !== cid));
 LS.set('mistakes', mistakes().filter(m => m.cid !== cid));
 LS.set('sessions', sessions().filter(s => s.cid !== cid));
 const l = labState(); delete l[cid]; LS.set('labs', l);
 const c = certState(); delete c[cid]; LS.set('certs', c);
 renderSettings();
}
function resetAll(){
 if(!confirm('Reset EVERYTHING?')) return;
 if(!confirm('Really? All attempts, mistakes, labs, sessions, statuses.')) return;
 ['certs','attempts','mistakes','labs','sessions','activeSession'].forEach(k => LS.del(k));
 go('today');
}
// -------- ROUTER --------
function render(s, arg){
 if(s === 'today') renderToday();
 else if(s === 'dash') renderDash();
 else if(s === 'certs') renderCerts();
 else if(s === 'cert') renderCert(arg);
 else if(s === 'practice') renderPractice(arg);
 else if(s === 'mistakes') renderMistakes(arg);
 else if(s === 'labs') renderLabs();
 else if(s === 'plan') renderPlan();
 else if(s === 'resources') renderResources();
 else if(s === 'settings') renderSettings();
}
renderToday();
</script>
